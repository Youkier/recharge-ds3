<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; connect-src 'self'; base-uri 'none'; form-action 'none'">
<meta name="color-scheme" content="light dark">
<title>Câble de recharge</title>
<link rel="stylesheet" href="essai.css">
</head>
<body>
<main>
  <header class="top">
    <h1 id="titre">Câble de recharge</h1>
    <p class="variante" id="variante" hidden></p>
  </header>

  <section class="card" aria-label="Câble">
    <p class="card-title">Câble</p>
    <details>
      <summary>Saisir l'adresse à la main</summary>
      <label class="champ" for="ip">Adresse du câble</label>
      <input type="text" id="ip" inputmode="decimal" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="par exemple 192.168.1.48">
      <p class="aide">Laissez vide pour que l'application retrouve le câble sur le Wi-Fi.</p>
    </details>
    <div class="actions">
      <button type="button" id="lire" class="principal">Lire l'état</button>
      <button type="button" id="chercher">Chercher le câble</button>
      <button type="button" id="cle" class="discret">Saisir la clé du câble</button>
    </div>
  </section>

  <section class="card" id="miseaupoint" aria-label="Mise au point" hidden>
    <p class="card-title">Mise au point (jamais dans la version publiée)</p>
    <label class="champ" for="heure">Heure de début à programmer</label>
    <input type="time" id="heure" value="05:00">
    <div class="actions">
      <button type="button" id="programmer">Programmer</button>
      <button type="button" id="filtre" class="discret">Vérifier le filtre du pont</button>
    </div>
  </section>

  <section class="card" aria-label="Résultat">
    <p class="card-title">Résultat</p>
    <p id="resultat" class="resultat" role="status" aria-live="polite">Aucune action pour l'instant.</p>
  </section>

  <p class="aide" id="horloge"></p>
</main>
<script type="module" src="essai.js"></script>
</body>
</html>
