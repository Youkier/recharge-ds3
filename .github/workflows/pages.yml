# Publication de la page Recharge DS 3 sur GitHub Pages.
#
# Ce que fait ce workflow :
#   1. à chaque push sur main (ou lancement à la main depuis l'onglet Actions),
#      il lance les tests de référence du calcul : node --test "tests/**/*.test.mjs" ;
#   2. si, et seulement si, les tests passent, il publie le dossier site/
#      (et rien d'autre) sur GitHub Pages.
#
# Aucun secret n'est nécessaire.
#
# Réglage à faire une seule fois sur GitHub, avant le premier push :
#   Settings → Pages → Build and deployment → Source : « GitHub Actions ».
#
# Les actions sont épinglées par empreinte de commit (version indiquée en
# commentaire). Pour les mettre à jour, vérifier la nouvelle version sur le
# dépôt officiel de chaque action et remplacer l'empreinte.

name: Publication GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permissions minimales par défaut : lecture du code seulement.
permissions:
  contents: read

# Un seul déploiement à la fois ; un déploiement en cours n'est jamais annulé.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Tests du calcul
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Lancer les tests
        run: node --test "tests/**/*.test.mjs"

  deploy:
    name: Publier site/
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Préparer le dossier site/
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Publier
        id: deploiement
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
