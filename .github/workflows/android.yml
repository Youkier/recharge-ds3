# Coque Android : construction de l'APK et essais sur émulateurs (phase 3b, lot C3).
#
# Ce que fait ce workflow :
#   1. job « construire » : tests Node, copie des fichiers embarqués par liste blanche (tools/assets-apk.mjs), tests
#      JUnit, APK de mise au point et APK de publication NON SIGNÉ, vérification de la liste des fichiers embarqués
#      et du manifeste ; les APK sont déposés en artefacts ;
#   2. job « emulateur » (API 35 et 36, profil 1080 x 2424 = Pixel 9 et Pixel 10) : émulateur lancé par un script maison,
#      faux câble TCP sur le runner (clé factice), scénarios pilotés par adb seul, captures en clair et en sombre.
#
# AUCUN secret : le vrai câble n'est jamais joint, aucune clé de signature n'existe ici. La signature (C3.5) sera un
# job séparé, plus tard. Aucun déclencheur « pull_request » : seul un push sur main (ou le lancement à la main) construit.
#
# Les actions sont épinglées par empreinte de commit (version en commentaire, vérifiée le 2026-11-19 sur les dépôts
# officiels, API des références git). Gradle n'a pas de wrapper dans le dépôt (pas de JAR binaire) : la version de Gradle
# est fixée ici (gradle-version), installée par l'action officielle gradle/actions/setup-gradle.

name: Coque Android

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "site/**"
      - "local/**"
      - "tools/assets-apk.mjs"
      - "tools/faux-cable-tcp.mjs"
      - "tests/tuya-local-faux-cable.mjs"
      - "tests/tuya-local-vecteurs.json"
      - "tests/tuya-local-cas.json"
      - "tests/plage-tardif-cas.json"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

env:
  GRADLE_VERSION: "9.6.0" # minimum demandé par AGP 9.5 (developer.android.com/build/releases/gradle-plugin)

jobs:
  construire:
    name: Construire l'APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Tests Node
        run: node --test "tests/**/*.test.mjs"

      - name: Copier les fichiers embarqués (liste blanche)
        run: node tools/assets-apk.mjs

      - name: Installer Java 17
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
          cache-disabled: true
          validate-wrappers: false # pas de wrapper dans le dépôt

      - name: Accepter les licences du SDK Android
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Tests JUnit (filtre du pont, registre, fichiers servis)
        run: gradle --project-dir android --no-daemon --console=plain test

      - name: APK de mise au point
        run: gradle --project-dir android --no-daemon --console=plain assembleDebug

      - name: APK de publication (non signé)
        run: gradle --project-dir android --no-daemon --console=plain assembleRelease

      - name: Vérifier les fichiers embarqués et le manifeste
        run: |
          set -euo pipefail
          mkdir -p sortie-construction
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          for APK in $(find android/build/outputs/apk -name '*.apk' | sort); do
            NOM="$(basename "$APK" .apk)"
            echo "=== $NOM"
            # Liste attendue propre à la variante : la page d'essai (android/essai/) seulement dans l'APK de mise au point.
            case "$NOM" in *release*) VARIANTE=release ;; *debug*) VARIANTE=debug ;; *) echo "variante inconnue : $NOM"; exit 1 ;; esac
            node tools/assets-apk.mjs --liste --variante="$VARIANTE" | sort > sortie-construction/assets-attendus.txt
            if [ "$VARIANTE" = release ] && grep -q '^android/essai/' sortie-construction/assets-attendus.txt; then echo "page d'essai attendue dans l'APK publié"; exit 1; fi
            # Contenu du dossier assets/ de l'APK. assets/dexopt/ (profils de démarrage ajoutés par AGP) est ignoré.
            unzip -Z1 "$APK" | grep '^assets/' | grep -v '^assets/dexopt/' | sed 's#^assets/##' | sort > "sortie-construction/assets-$NOM.txt" || true
            diff -u sortie-construction/assets-attendus.txt "sortie-construction/assets-$NOM.txt"
            echo "assets/dexopt : $(unzip -Z1 "$APK" | grep -c '^assets/dexopt/' || true) fichier(s) ajouté(s) par AGP (ignorés)"
            # Aucun fichier de secrets ni d'outil dans l'APK, où que ce soit.
            if unzip -Z1 "$APK" | grep -E '(^|/)(\.env|\.dev\.vars|tools/|tests/|worker/|\.claude/)'; then echo "fichier interdit dans l'APK"; exit 1; fi
            "$AAPT2" dump badging "$APK" > "sortie-construction/badging-$NOM.txt"
            grep -E "^(package|(min)?[sS]dkVersion|targetSdkVersion)" "sortie-construction/badging-$NOM.txt" || true
            grep -q "targetSdkVersion:'36'" "sortie-construction/badging-$NOM.txt" || { echo "targetSdk différent de 36"; exit 1; }
            grep -qE "^(min)?[sS]dkVersion:'35'" "sortie-construction/badging-$NOM.txt" || { echo "minSdk différent de 35"; exit 1; }
            "$AAPT2" dump permissions "$APK" > "sortie-construction/permissions-$NOM.txt"
            cat "sortie-construction/permissions-$NOM.txt"
            if grep -q "ACCESS_LOCAL_NETWORK" "sortie-construction/permissions-$NOM.txt"; then echo "ACCESS_LOCAL_NETWORK interdite"; exit 1; fi
            # Rien ne démarre sans un geste : ni au démarrage du téléphone, ni par une alarme exacte.
            for P in RECEIVE_BOOT_COMPLETED SCHEDULE_EXACT_ALARM USE_EXACT_ALARM; do
              if grep -q "android.permission.$P'" "sortie-construction/permissions-$NOM.txt"; then echo "$P interdite"; exit 1; fi
            done
            # Pont TCP (INTERNET, ACCESS_NETWORK_STATE) et attente en arrière-plan (service de premier plan connectedDevice,
            # décisions du 2026-11-21, essai E0 réussi) : FOREGROUND_SERVICE, FOREGROUND_SERVICE_CONNECTED_DEVICE,
            # CHANGE_NETWORK_STATE (prérequis du type), WAKE_LOCK, POST_NOTIFICATIONS. Toutes présentes, aucune autre.
            # (Exception : la permission interne DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION, propre à l'application, que la
            # bibliothèque androidx.core ajoute d'elle-même ; elle ne donne aucun accès.)
            ATTENDUES="INTERNET ACCESS_NETWORK_STATE FOREGROUND_SERVICE FOREGROUND_SERVICE_CONNECTED_DEVICE CHANGE_NETWORK_STATE WAKE_LOCK POST_NOTIFICATIONS"
            PERMISES="fr.rechargeds3.coque.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION"
            for P in $ATTENDUES; do
              grep -q "name='android.permission.$P'" "sortie-construction/permissions-$NOM.txt" || { echo "permission $P absente"; exit 1; }
              PERMISES="$PERMISES android.permission.$P"
            done
            # Le service d'attente : un seul, non exporté, de type connectedDevice (0x10), jamais lancé au démarrage du téléphone.
            "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > "sortie-construction/manifeste-$NOM.txt"
            if grep -q "BOOT_COMPLETED" "sortie-construction/manifeste-$NOM.txt"; then echo "BOOT_COMPLETED interdit"; exit 1; fi
            [ "$(grep -c "E: service " "sortie-construction/manifeste-$NOM.txt" || true)" = 1 ] || { echo "un seul service attendu"; grep -A4 "E: service " "sortie-construction/manifeste-$NOM.txt" || true; exit 1; }
            SERVICE="$(grep -A10 "E: service " "sortie-construction/manifeste-$NOM.txt")"
            echo "$SERVICE"
            echo "$SERVICE" | grep -q 'android:name([^)]*)="fr.rechargeds3.coque.AttenteWifi"' || { echo "service AttenteWifi absent"; exit 1; }
            echo "$SERVICE" | grep -qE 'android:exported\([^)]*\)=(false|\(type 0x12\)0x0)' || { echo "service exporté ou attribut absent"; exit 1; }
            echo "$SERVICE" | grep -qE 'android:foregroundServiceType\([^)]*\)=(\(type 0x11\))?(0x0*10|16)( |$)' || { echo "type de service différent de connectedDevice"; exit 1; }
            AUTRES=""
            for NOM_P in $(grep -o "uses-permission: name='[^']*'" "sortie-construction/permissions-$NOM.txt" | sed "s/^uses-permission: name='//; s/'\$//"); do
              case " $PERMISES " in *" $NOM_P "*) ;; *) AUTRES="$AUTRES $NOM_P" ;; esac
            done
            if [ -n "$AUTRES" ]; then echo "permission(s) inattendue(s) :$AUTRES"; exit 1; fi
          done

      - name: Déposer les APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk
          path: |
            android/build/outputs/apk/**/*.apk
            sortie-construction/
          if-no-files-found: error
          retention-days: 14

  emulateur:
    name: Émulateur API ${{ matrix.api }}
    needs: construire
    runs-on: ubuntu-latest
    timeout-minutes: 120 # S21 et sa variante Wi-Fi (330 s chacune), S-C et S-I2 (500 s écran éteint) ajoutent une quarantaine de minutes
    strategy:
      fail-fast: false
      matrix:
        api: [35, 36]
    env:
      SORTIE_CI: android-ci-sortie/api${{ matrix.api }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Installer Node (LTS)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Récupérer les APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: apk

      - name: Lancer l'émulateur
        run: bash android/ci/emulateur.sh "${{ matrix.api }}"

      - name: Scénarios sur le faux câble
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          APK="$(find apk -name '*debug*.apk' | head -1)"
          echo "APK essayé : $APK"
          bash android/ci/scenarios.sh "$APK" "$SORTIE_CI"

      - name: Déposer captures et journaux
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: essais-api${{ matrix.api }}
          path: android-ci-sortie/
          if-no-files-found: warn
          retention-days: 14

  # Signature (lot C3.5, décision du 2026-11-19). Job à part : la clé n'est présente que dans ce job, qui n'exécute ni
  # Gradle ni code du dépôt (pas de checkout) : seulement apksigner du SDK sur l'APK non signé produit par « construire ».
  # Environnement « android-signature » limité à la branche main (réglage GitHub) ; aucun déclencheur pull_request.
  signer:
    name: Signer l'APK de publication
    needs: [construire, emulateur]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: android-signature
    steps:
      - name: Récupérer les APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk
          path: apk

      - name: Signer avec apksigner
        env:
          CLE_B64: ${{ secrets.APK_KEYSTORE_B64 }}
          MDP: ${{ secrets.APK_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          BT="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          NON_SIGNE="$(find apk -name '*release-unsigned.apk' | head -1)"
          [ -n "$NON_SIGNE" ] || { echo "APK non signé introuvable"; exit 1; }
          umask 077
          CLE="$RUNNER_TEMP/cle.p12"
          trap 'rm -f "$CLE"' EXIT
          printf '%s' "$CLE_B64" | base64 -d > "$CLE"
          mkdir -p signe
          "$BT/zipalign" -c 4 "$NON_SIGNE"
          "$BT/apksigner" sign --ks "$CLE" --ks-type PKCS12 --ks-key-alias coque --ks-pass env:MDP --key-pass env:MDP \
            --out signe/recharge-ds3-coque.apk "$NON_SIGNE"
          rm -f "$CLE"
          "$BT/apksigner" verify --print-certs signe/recharge-ds3-coque.apk | grep "SHA-256" | tee signe/empreinte.txt
          # Empreinte SHA-256 du fichier APK signé lui-même (à comparer à celle du fichier téléchargé), affichée et publiée dans l'artefact.
          ( cd signe && sha256sum recharge-ds3-coque.apk | tee empreinte-apk.txt )
          # Empreinte du certificat attendue (clé créée le 2026-11-19) : toute autre clé fait échouer le job.
          grep -q "2b2a896b9edb49ed8f22ddd4f6dfdc825b47cf5f3931837bff9796b4a0512033" signe/empreinte.txt

      - name: Déposer l'APK signé
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-signe
          path: signe/
          if-no-files-found: error
          retention-days: 30

  # Essai rapide de l'APK signé : installation, lancement sans plantage, version non déboguable, réinstallation par-dessus.
  essai-signe:
    name: Essai de l'APK signé
    needs: signer
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SORTIE_CI: android-ci-sortie/signe
    steps:
      - name: Récupérer le code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Récupérer l'APK signé
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apk-signe
          path: signe

      - name: Lancer l'émulateur
        run: bash android/ci/emulateur.sh 36

      - name: Installer, lancer, réinstaller
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          AAPT2="$(ls -d "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)"
          if "$AAPT2" dump badging signe/recharge-ds3-coque.apk | grep -q "application-debuggable"; then echo "APK signé déboguable"; exit 1; fi
          # Mise à jour réelle : la dernière préversion publiée d'abord, puis la nouvelle par-dessus (même clé de signature,
          # versionCode plus grand), sans désinstaller. Critère du lot C4 (« une mise à jour ne fait pas ressaisir la clé »).
          # Lecture publique, sans jeton ni outil de publication (dépôt public).
          mkdir -p precedente
          TAG="$(curl -fsSL "https://api.github.com/repos/$GITHUB_REPOSITORY/releases?per_page=20" | jq -r '[.[] | select(.tag_name | startswith("coque-v"))][0].tag_name // empty' || true)"
          if [ -n "$TAG" ] && curl -fsSL -o precedente/recharge-ds3-coque.apk "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/recharge-ds3-coque.apk"; then
            echo "préversion précédente : $TAG"
            adb install precedente/recharge-ds3-coque.apk
            echo "préversion précédente installée"
          else
            echo "aucune préversion précédente téléchargeable : installation à neuf"
          fi
          adb install -r signe/recharge-ds3-coque.apk
          adb shell am start -W -n fr.rechargeds3.coque/.MainActivity
          sleep 5
          adb shell pidof fr.rechargeds3.coque || { echo "l'application ne tourne pas"; exit 1; }
          adb exec-out screencap -p > "$SORTIE_CI-ouverture.png" || true
          adb install -r signe/recharge-ds3-coque.apk
          if adb logcat -d -b crash | grep -q "fr.rechargeds3.coque"; then echo "plantage"; exit 1; fi

      - name: Scénario court sur l'APK signé (page servie, essaiFiltre inatteignable)
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$PATH"
          mkdir -p android-ci-sortie
          bash android/ci/essai-signe.sh signe/recharge-ds3-coque.apk "$SORTIE_CI"

      - name: Déposer la capture
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: essai-signe
          path: android-ci-sortie/
          if-no-files-found: warn
          retention-days: 14
